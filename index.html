<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crescendo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
:root{color-scheme:dark;--bg:#14061f;--ink:#fff1e6;--dim:rgba(255,241,230,.62);--h:300;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 22px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:clamp(2.2rem,7vw,4.6rem);line-height:.95;letter-spacing:-.03em;font-variation-settings:"wght" 200,"opsz" 96;color:var(--ink)}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.snd{padding:8px 14px;border-radius:99px;background:rgba(255,241,230,.08);font-size:.85rem;color:var(--dim)}
.bot{display:flex;flex-direction:column;align-items:center;gap:18px}
#hint{margin:0;font-size:clamp(1rem,2.6vw,1.25rem);font-weight:300;text-align:center;max-width:30ch;min-height:2.6em;transition:opacity .5s;color:var(--ink)}
nav{display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(255,241,230,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{padding:11px 22px;border-radius:99px;font-size:.95rem;font-weight:400;color:var(--dim);transition:background .3s,color .3s}
nav button[aria-pressed=true]{background:var(--ink);color:#2a0c3a;font-weight:600}
#meter{position:fixed;left:0;bottom:0;width:3px;height:0;background:hsl(var(--h),95%,62%);box-shadow:0 0 14px hsl(var(--h),95%,62%)}
#songbox{position:fixed;right:22px;top:calc(env(safe-area-inset-top,0px) + 66px);width:200px;display:flex;flex-direction:column;gap:6px;z-index:2}
#songbox iframe{width:200px;height:113px;border:0;border-radius:12px}
.row{display:flex;gap:6px}
#songurl{flex:1;min-width:0;padding:8px 12px;border:0;border-radius:99px;background:rgba(255,241,230,.1);color:var(--ink);font:inherit;font-size:.8rem;-webkit-user-select:text;user-select:text}
#songurl::placeholder{color:var(--dim)}
#songgo{padding:8px 12px;border-radius:99px;background:var(--ink);color:#2a0c3a;font-size:.8rem;font-weight:600}
#songmsg{margin:0;font-size:.75rem;color:var(--dim);min-height:1em}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="meter" aria-hidden="true"></div>
<div id="songbox">
  <div id="ytp"></div>
  <div class="row"><input id="songurl" type="text" placeholder="Paste YouTube link" aria-label="YouTube link" autocomplete="off"><button id="songgo">Load</button></div>
  <p id="songmsg" role="status"></p>
</div>
<div class="ui">
  <div class="top">
    <h1 id="title">Crescendo</h1>
    <button class="snd" id="snd" aria-pressed="true">Sound on</button>
  </div>
  <div class="bot">
    <p id="hint" role="status"></p>
    <nav aria-label="Modes">
      <button data-m="tease" aria-pressed="true">Tease</button>
      <button data-m="press" aria-pressed="false">Press</button>
      <button data-m="rhythm" aria-pressed="false">Rhythm</button>
    </nav>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hintEl=document.getElementById('hint'),title=document.getElementById('title'),meter=document.getElementById('meter'),root=document.documentElement;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,D;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();

let mode='tease',a=0,phase='build',pt=0,held=false,t=0,flash=0,last=performance.now(),nextVib=0;
let px=W/2,py=H/2,lx=null,ly=null,tapLast=0,tapIv=0,streak=0;
const P=[],R=[];
const hue=x=>(270+x*130)%360;
const cx=()=>W/2,cy=()=>H*.46;
const HINTS={tease:'Keep moving. Stopping lets it fade.',press:'Press and hold. Let go when you can\u2019t wait.',rhythm:'Tap a steady beat. Hesitate and it slips.'};
let hintTimer;
function setHint(s){hintEl.style.opacity=0;clearTimeout(hintTimer);hintTimer=setTimeout(()=>{hintEl.textContent=s||HINTS[mode];hintEl.style.opacity=1},RM?0:350)}
setHint();

/* ---------- sound: YouTube player (official embed) ---------- */
const DEFAULT_URL=''; /* optional: paste a YouTube link here to hard-code the song for every visitor */
let yt=null,ytOk=false,snd=true,vol=-1,curId=null,apiAsked=false;
const songMsg=m=>{document.getElementById('songmsg').textContent=m};
const ytId=u=>{u=(u||'').trim();const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null)};
function mkPlayer(){yt=new YT.Player('ytp',{width:200,height:113,videoId:curId,playerVars:{playsinline:1,rel:0,autoplay:1},
  events:{onReady:()=>{ytOk=true;vol=-1;if(!snd)yt.pauseVideo()},onStateChange:e=>{if(e.data===0&&snd)yt.playVideo()}}})}
function setSong(u){
  const id=ytId(u);if(!id){songMsg('That is not a YouTube link.');return}
  curId=id;songMsg('');try{localStorage.setItem('crescendo_yt',id)}catch(e){}
  if(yt&&ytOk){yt.loadVideoById({videoId:id});if(!snd)yt.pauseVideo();return}
  if(window.YT&&YT.Player){mkPlayer();return}
  if(!apiAsked){apiAsked=true;window.onYouTubeIframeAPIReady=mkPlayer;const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}
}
function initAudio(){if(ytOk&&snd){const st=yt.getPlayerState();if(st!==1&&st!==3)yt.playVideo()}}
function aud(){if(!ytOk)return;const v=snd?(phase==='peak'?100:Math.round(10+a*90)):0;if(v!==vol){vol=v;yt.setVolume(v)}}
function tick(){}
function bloom(){}
document.getElementById('snd').onclick=e=>{snd=!snd;e.currentTarget.setAttribute('aria-pressed',snd);e.currentTarget.textContent=snd?'Sound on':'Sound off';if(ytOk){snd?yt.playVideo():yt.pauseVideo()}};
const go=()=>setSong(document.getElementById('songurl').value);
document.getElementById('songgo').onclick=go;
document.getElementById('songurl').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
let saved=null;try{saved=localStorage.getItem('crescendo_yt')}catch(e){}
if(DEFAULT_URL||saved)setSong(DEFAULT_URL||saved);

/* ---------- state changes ---------- */
function climax(){
  if(phase!=='build')return;
  phase='peak';pt=0;flash=1;a=1;
  const N=RM?60:360;
  for(let i=0;i<N;i++){const an=Math.random()*6.283,sp=80+Math.random()*620;
    P.push({x:cx(),y:cy(),vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:0,m:1.5+Math.random()*2.5,h:(Math.random()<.5?330:20)+Math.random()*50,s:1+Math.random()*2.5})}
  for(let i=0;i<4;i++)R.push({r:20,v:500+i*160,l:0,m:2.2+i*.3,d:i*.12});
  if(navigator.vibrate)navigator.vibrate([30,40,60,50,120,60,260]);
  bloom();setHint('Let it ring.')
}
function setMode(m){mode=m;held=false;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));if(phase==='build')setHint()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

/* ---------- input ---------- */
function emit(x,y,n,spd){for(let i=0;i<n&&P.length<900;i++){const an=Math.random()*6.283,s=Math.random()*spd;
  P.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s,l:0,m:.8+Math.random()*1.4,h:hue(a)+Math.random()*30-15,s:1+Math.random()*2})}}
cv.addEventListener('pointerdown',e=>{
  initAudio();px=e.clientX;py=e.clientY;lx=px;ly=py;
  if(mode==='press')held=true;
  if(mode==='rhythm'&&phase==='build'){
    const now=performance.now()/1000,iv=now-tapLast;
    if(tapLast&&iv>.25&&iv<.9){
      if(tapIv&&Math.abs(iv-tapIv)<.09){streak++;a=Math.min(1,a+.1+Math.min(streak,5)*.01)}else{streak=0;a=Math.min(1,a+.025)}
      tapIv=iv
    }else{streak=0;tapIv=0;if(tapLast&&iv>=.9)a=Math.max(0,a-.05)}
    tapLast=now;R.push({r:30,v:260+a*300,l:0,m:1.1,d:0});emit(px,py,10,160);tick();
    if(a>=1)climax()
  }
});
addEventListener('pointerup',()=>{
  if(held&&mode==='press'&&phase==='build'){held=false;if(a>.8)climax()}
  held=false;lx=null
});
cv.addEventListener('pointermove',e=>{
  if(mode!=='tease'||phase!=='build'||e.buttons===0&&e.pointerType==='touch')return;
  px=e.clientX;py=e.clientY;
  if(lx!==null){const d=Math.hypot(px-lx,py-ly);a=Math.min(1,a+Math.min(d,70)*.0007);emit(px,py,Math.ceil(d/10),60)}
  lx=px;ly=py
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='1')setMode('tease');if(e.key==='2')setMode('press');if(e.key==='3')setMode('rhythm');
  if(e.code==='Space'&&!e.repeat&&mode==='press'){e.preventDefault();initAudio();held=true}
});
addEventListener('keyup',e=>{if(e.code==='Space'&&held&&mode==='press'&&phase==='build'){held=false;if(a>.8)climax()}else if(e.code==='Space')held=false});

/* ---------- loop ---------- */
function frame(n){
  const dt=Math.min((n-last)/1000,.05);last=n;t+=dt;
  if(phase==='build'){
    if(mode==='press'&&held)a=Math.min(1,a+dt*(.12+a*.28));
    else a=Math.max(0,a-dt*(mode==='press'?.35:.07));
    if(a>=1)climax();
    if(held&&a>.2&&t>nextVib){if(navigator.vibrate)navigator.vibrate(8+a*30);nextVib=t+.4-.28*a}
  }else{
    pt+=dt;
    if(phase==='peak'){a=1;if(pt>1.6){phase='after';pt=0;setHint('Stay here a moment.')}}
    else{a=Math.max(.12,a-dt*.13);if(pt>9){phase='build';pt=0;a=.1;setHint()}}
  }
  /* ambient particles: orbit when building, embers when resting */
  if(P.length<700&&Math.random()<(.25+a*1.6)*(RM?.3:1)){
    if(phase==='after'){P.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*14,vy:-(20+Math.random()*40),l:0,m:4+Math.random()*4,h:20+Math.random()*30,s:1+Math.random()*1.6})}
    else{const an=Math.random()*6.283,r=Math.min(W,H)*(.1+.16*a),tg=an+1.57,sp=40+a*180;
      P.push({x:cx()+Math.cos(an)*r,y:cy()+Math.sin(an)*r,vx:Math.cos(tg)*sp,vy:Math.sin(tg)*sp,l:0,m:1+Math.random(),h:hue(a)+Math.random()*30-15,s:1+Math.random()*1.8})}
  }
  aud();

  /* draw */
  ctx.save();
  if(phase==='peak'&&!RM&&pt<.7){const k=8*(1-pt/.7);ctx.translate((Math.random()-.5)*k,(Math.random()-.5)*k)}
  ctx.globalCompositeOperation='source-over';
  const gx=W/2+(px-W/2)*.25*(mode==='tease'?1:0),gy=H*.46+(py-H*.46)*.25*(mode==='tease'?1:0);
  const g=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.max(W,H)*(.55+a*.35));
  g.addColorStop(0,`hsla(${hue(a)},85%,${14+a*30}%,1)`);g.addColorStop(.55,`hsla(${hue(a*.6)},70%,${8+a*10}%,1)`);g.addColorStop(1,'#14061f');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);

  ctx.globalCompositeOperation='lighter';
  /* orb */
  const tr=a*a*(RM?0:5),ox=cx()+(Math.random()-.5)*tr,oy=cy()+(Math.random()-.5)*tr;
  const base=Math.min(W,H),r=base*(.07+.16*a+(RM?0:.025*Math.sin(t*(2+a*14))*a));
  const og=ctx.createRadialGradient(ox,oy,0,ox,oy,r*4);
  og.addColorStop(0,`hsla(${hue(a)+10},100%,${60+a*30}%,.95)`);og.addColorStop(.25,`hsla(${hue(a)},95%,55%,.45)`);og.addColorStop(1,`hsla(${hue(a)-20},90%,40%,0)`);
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,r*4,0,6.283);ctx.fill();
  ctx.fillStyle=`hsla(${hue(a)+20},100%,${75+a*20}%,.9)`;ctx.beginPath();ctx.arc(ox,oy,r*.55,0,6.283);ctx.fill();
  ctx.lineWidth=1.2;
  for(let i=1;i<=3;i++){ctx.strokeStyle=`hsla(${hue(a)},90%,70%,${.22-i*.05})`;ctx.beginPath();ctx.arc(ox,oy,r*(1+i*.5)+Math.sin(t*1.5+i)*4*(a+.2),0,6.283);ctx.stroke()}

  /* rings */
  for(let i=R.length-1;i>=0;i--){const o=R[i];if(o.d>0){o.d-=dt;continue}
    o.l+=dt;o.r+=o.v*dt;o.v*=.985;const k=1-o.l/o.m;if(k<=0){R.splice(i,1);continue}
    ctx.strokeStyle=`hsla(${hue(a)+20},100%,75%,${k*.6})`;ctx.lineWidth=1+k*5;ctx.beginPath();ctx.arc(cx(),cy(),o.r,0,6.283);ctx.stroke()}
  /* particles */
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.l+=dt;const k=1-p.l/p.m;if(k<=0){P.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;
    ctx.fillStyle=`hsla(${p.h},95%,${60+(1-k)*10}%,${k*.85})`;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+k),0,6.283);ctx.fill()}
  ctx.restore();

  /* soft flash (a single fade, not a strobe) */
  if(flash>0){flash=Math.max(0,flash-dt*1.1);ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(255,241,230,${flash*(RM?.25:.7)})`;ctx.fillRect(0,0,W,H)}

  /* chrome reacts too */
  root.style.setProperty('--h',hue(a));
  title.style.fontVariationSettings=`"wght" ${Math.round(200+a*600)},"opsz" 96`;
  meter.style.height=(a*100)+'%';
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script>
</body>
</html>
